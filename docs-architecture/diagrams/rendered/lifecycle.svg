<text x="1390" y="114" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;1. Parse CLI args\n(--config, --daemon, --cli)&quot;</text>
<text x="1390" y="270" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;2. Check CAP_NET_ADMIN\nprivileges&quot;</text>
<text x="1390" y="426" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;3. Load JSON config\nfrom file&quot;</text>
<text x="1390" y="582" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;4. Spawn CAF actors\n(vpn_manager, system_monitor)&quot;</text>
<text x="1390" y="738" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;5. Create EventBus + ThreadPool&quot;</text>
<text x="1390" y="894" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;6. Start subsystems&quot;</text>
<text x="231.7249999999999" y="1050" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;VpnManager\nAuto-connects configured VPNs&quot;</text>
<text x="630.9249999999997" y="1050" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;VpnInterfaceMonitor\nWatches netlink for TUN events&quot;</text>
<text x="1008.675" y="1050" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;MavRouter\nStarts telemetry routing&quot;</text>
<text x="1390" y="1050" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;MavExtenderManager\nListens for VPN interface events&quot;</text>
<text x="1796.35" y="1050" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;QmiModemController\nManages cellular modem&quot;</text>
<text x="2163.375" y="1050" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;IPCServer\nUnix socket for remote clients&quot;</text>
<text x="2523.25" y="1050" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;CLI REPL\nInteractive console (if --cli)&quot;</text>
<text x="1388.2125" y="1223" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;1. Stop accepting new connections&quot;</text>
<text x="1388.2125" y="1379" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;2. Drain MAVLink extenders&quot;</text>
<text x="1388.2125" y="1535" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;3. Disconnect all VPNs&quot;</text>
<text x="1388.2125" y="1691" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;4. Stop QMI modem&quot;</text>
<text x="1388.2125" y="1847" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;5. Tear down actors&quot;</text>
<text x="1388.2125" y="2003" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;6. Exit&quot;</text>
