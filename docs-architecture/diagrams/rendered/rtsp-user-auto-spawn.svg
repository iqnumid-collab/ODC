<text x="746" y="1050" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Compressor starts — manual path works&quot;</text>
<text x="746" y="1206" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;rtsp status → compressor running&quot;</text>
<text x="746" y="1362" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;User runs: rtsp stop manualtest&quot;</text>
<text x="746" y="1518" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Compressor torn down&quot;</text>
