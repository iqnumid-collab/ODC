<text x="605.9" y="1457.8" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;std::thread created\nGMainLoop runs\nRtspBridge starts&quot;</text>
<text x="605.9" y="1613.8" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;rtsp status now shows:\nconnection: mycam\nrunning: yes&quot;</text>
<text x="1040.85" y="1457.8" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;glib_thread.join()\nbridge-&gt;stop()&quot;</text>
<text x="1040.85" y="1613.8" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;rtsp status: No compressor instances active&quot;</text>
<text x="210.275" y="1301.8" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;rtsp status\n→ list all compressors&quot;</text>
<text x="605.9" y="1301.8" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;rtsp start mycam wg0 10.0.0.1\n→ spawn compressor thread&quot;</text>
<text x="1040.85" y="1301.8" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;rtsp stop mycam\n→ quit GLib loop, join thread&quot;</text>
<text x="1375.7" y="1301.8" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;rtsp help\n→ show usage info&quot;</text>
