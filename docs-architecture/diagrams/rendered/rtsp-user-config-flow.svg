<text x="823.375" y="989.8" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;CLI auto-connects to daemon\n(no --cli flag needed)&quot;</text>
<text x="1172.525" y="989.8" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Socket poll timeout\n→ FAIL&quot;</text>
