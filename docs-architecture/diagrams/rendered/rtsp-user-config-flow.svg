<text x="997.95" y="256" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Edit config.json\n{rtsp: {enabled: true}}&quot;</text>
<text x="997.95" y="412" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Start daemon\nodc-onboard --daemon&quot;</text>
