<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1175.644 590" width="1175.644" height="590" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#3d59a1;--accent:#7aa2f7;--muted:#565f89;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="alt" data-label="VPN already connected">
  <rect x="878.436" y="410" width="122.12200000000007" height="60" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="878.436" y="410" width="162.19" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="884.436" y="419" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [VPN already connected]</text>
</g>
<g class="block" data-type="alt" data-label="invalid">
  <rect x="30" y="158" width="1115.644" height="382" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="158" width="72.43" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="36" y="167" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [invalid]</text>
  <line x1="30" y1="234" x2="1145.644" y2="234" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="38" y="248" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">[valid]</text>
</g>
<line class="lifeline" data-actor="Client" x1="99.212" y1="70" x2="99.212" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="IPC" x1="262.4525" y1="70" x2="262.4525" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="GV" x1="428.657" y1="70" x2="428.657" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="GR" x1="589.304" y1="70" x2="589.304" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="PM" x1="768.1055" y1="70" x2="768.1055" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="LE" x1="939.4970000000001" y1="70" x2="939.4970000000001" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="YAML" x1="1083.101" y1="70" x2="1083.101" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Client" data-to="IPC" data-label="graph.links.add {id, from, to, bind}" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="99.212" y1="90" x2="262.4525" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="180.83225" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">graph.links.add {id, from, to, bind}</text>
</g>
<g class="message" data-from="IPC" data-to="GV" data-label="validate(diff)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="262.4525" y1="130" x2="428.657" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="345.55475" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">validate(diff)</text>
</g>
<g class="message" data-from="GV" data-to="Client" data-label="graph.validate errors" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="428.657" y1="198" x2="99.212" y2="198" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="263.9345" y="188" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">graph.validate errors</text>
</g>
<g class="message" data-from="GV" data-to="GR" data-label="apply(diff)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="428.657" y1="262" x2="589.304" y2="262" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="508.9805" y="252" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">apply(diff)</text>
</g>
<g class="message" data-from="GR" data-to="LE" data-label="register link" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="589.304" y1="302" x2="939.4970000000001" y2="302" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="764.4005" y="292" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">register link</text>
</g>
<g class="message" data-from="GR" data-to="PM" data-label="write_atomic(yaml)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="589.304" y1="342" x2="768.1055" y2="342" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="678.70475" y="332" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">write_atomic(yaml)</text>
</g>
<g class="message" data-from="PM" data-to="YAML" data-label="rename tmp → system.yaml" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="768.1055" y1="382" x2="1083.101" y2="382" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="925.6032500000001" y="372" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">rename tmp → system.yaml</text>
</g>
<g class="message" data-from="LE" data-to="LE" data-label="propagate binding immediately" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="939.4970000000001,450 969.4970000000001,450 969.4970000000001,470 939.4970000000001,470" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="977.4970000000001" y="460" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">propagate binding immediately</text>
</g>
<g class="message" data-from="GR" data-to="Client" data-label="success + graph.status" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="589.304" y1="520" x2="99.212" y2="520" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="344.258" y="510" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">success + graph.status</text>
</g>
<g class="actor" data-id="Client" data-label="CLI / IPC Client" data-type="participant">
  <rect x="40" y="30" width="118.424" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="99.212" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">CLI / IPC Client</text>
</g>
<g class="actor" data-id="IPC" data-label="graph.* handler" data-type="participant">
  <rect x="198.42399999999998" y="30" width="128.05700000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="262.4525" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">graph.* handler</text>
</g>
<g class="actor" data-id="GV" data-label="GraphValidator" data-type="participant">
  <rect x="366.481" y="30" width="124.352" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="428.657" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">GraphValidator</text>
</g>
<g class="actor" data-id="GR" data-label="GraphRuntime" data-type="participant">
  <rect x="530.833" y="30" width="116.942" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="589.304" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">GraphRuntime</text>
</g>
<g class="actor" data-id="PM" data-label="PersistenceManager" data-type="participant">
  <rect x="687.775" y="30" width="160.661" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="768.1055" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">PersistenceManager</text>
</g>
<g class="actor" data-id="LE" data-label="LinkEngine" data-type="participant">
  <rect x="888.436" y="30" width="102.122" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="939.4970000000001" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">LinkEngine</text>
</g>
<g class="actor" data-id="YAML" data-label="system.yaml" data-type="participant">
  <rect x="1030.5580000000002" y="30" width="105.086" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="1083.101" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">system.yaml</text>
</g>
</svg>