  <rect x="152.48899999999998" y="158" width="155.58999999999997" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="158.48899999999998" y="167" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">loop [each RTSP instance]</text>
</g>
