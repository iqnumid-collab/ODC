<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 907.7090000000001 440" width="907.7090000000001" height="440" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#3d59a1;--accent:#7aa2f7;--muted:#565f89;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="FC" x1="112.92399999999999" y1="70" x2="112.92399999999999" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="MAVR" x1="291.35499999999996" y1="70" x2="291.35499999999996" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="MAVE" x1="448.29699999999997" y1="70" x2="448.29699999999997" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="TUN" x1="626.3575" y1="70" x2="626.3575" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="GCS" x1="810.346" y1="70" x2="810.346" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="FC" data-to="MAVR" data-label="MAVLink frames" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="112.92399999999999" y1="90" x2="291.35499999999996" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="202.13949999999997" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">MAVLink frames</text>
</g>
<g class="message" data-from="MAVR" data-to="MAVE" data-label="route to extender endpoint" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="291.35499999999996" y1="130" x2="448.29699999999997" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="369.82599999999996" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">route to extender endpoint</text>
</g>
<g class="message" data-from="MAVE" data-to="TUN" data-label="UDP bind to tunnel IP" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="448.29699999999997" y1="170" x2="626.3575" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="537.3272499999999" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">UDP bind to tunnel IP</text>
</g>
<g class="message" data-from="TUN" data-to="GCS" data-label="encrypted MAVLink over VPN" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="626.3575" y1="210" x2="810.346" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="718.35175" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">encrypted MAVLink over VPN</text>
</g>
<g class="message" data-from="GCS" data-to="TUN" data-label="return traffic" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="810.346" y1="250" x2="626.3575" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="718.35175" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">return traffic</text>
</g>
<g class="message" data-from="TUN" data-to="MAVE" data-label="inbound MAVLink" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="626.3575" y1="290" x2="448.29699999999997" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="537.3272499999999" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">inbound MAVLink</text>
</g>
<g class="message" data-from="MAVE" data-to="MAVR" data-label="inject to primary router" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="448.29699999999997" y1="330" x2="291.35499999999996" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="369.82599999999996" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">inject to primary router</text>
</g>
<g class="message" data-from="MAVR" data-to="FC" data-label="forward to FC" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="291.35499999999996" y1="370" x2="112.92399999999999" y2="370" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="202.13949999999997" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">forward to FC</text>
</g>
<g class="actor" data-id="FC" data-label="Flight Controller UART" data-type="participant">
  <rect x="30" y="30" width="165.84799999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="112.92399999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Flight Controller UART</text>
</g>
<g class="actor" data-id="MAVR" data-label="mav_primary" data-type="participant">
  <rect x="235.84799999999996" y="30" width="111.01400000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="291.35499999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">mav_primary</text>
</g>
<g class="actor" data-id="MAVE" data-label="mav_ext_cloud" data-type="participant">
  <rect x="386.86199999999997" y="30" width="122.87" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="448.29699999999997" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">mav_ext_cloud</text>
</g>
<g class="actor" data-id="TUN" data-label="VPN tunnel wg-cloud" data-type="participant">
  <rect x="549.732" y="30" width="153.251" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="626.3575" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">VPN tunnel wg-cloud</text>
</g>
<g class="actor" data-id="GCS" data-label="Remote GCS UDP" data-type="participant">
  <rect x="742.983" y="30" width="134.726" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="810.346" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Remote GCS UDP</text>
</g>
</svg>