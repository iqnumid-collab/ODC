# ODC-DEV-VPN Variant C — OpenVPN only (eth WAN)
# No MAV / RTSP / cellular. Install as /etc/odc-onboard/system.yaml on DUT.
version: 2

general:
  log_level: info
  socket: /run/odc-onboard/odc-onboard.sock

components:
  - id: vpn_lab
    type: vpn.openvpn
    enabled: true
    config:
      config_path: /etc/odc-onboard/vpn/lab-ovpn.ovpn

links: []
triggers: []
