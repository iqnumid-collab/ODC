version: 2
general:
  log_level: info
  socket: /run/odc-onboard/odc-onboard.sock

components:
  - id: rtsp_lab
    type: rtsp.compressor
    enabled: true
    config:
      input_host: 127.0.0.1
      output_codec: h264
      output_bitrate_kbps: 1200
      output_width: 1280
      output_height: 720
      output_framerate: 30
      input_port: 8554
      input_path: /stream
      output_port: 8555
      output_path: /stream
      input_use_tcp: false
      abr_enabled: true
      abr_min_bitrate: 200
      abr_max_bitrate: 1200
      abr_step_percent: 25
      abr_loss_threshold_down: 3.0
      abr_loss_threshold_up: 1.0
      abr_stable_seconds: 4
      abr_interval_seconds: 2
      abr_force_cycle: true

links: []
triggers: []
