# ODC-DEV-MAV Phases C–D: router + WireGuard + extender (hexa-five peer)
# Per-DUT: set config_path to that board's WG peer (ODC_WG_CONFIG).
# Prefer Ethernet WAN for VPN; omit cellular unless proving VPN-over-cellular.
version: 2

general:
  log_level: info
  socket: /run/odc-onboard/odc-onboard.sock

components:
  - id: vpn_lab
    type: vpn.wireguard
    enabled: true
    config:
      # Override per DUT: /etc/odc-onboard/vpn/lab-wg.conf (distinct keys/IPs)
      config_path: /etc/odc-onboard/vpn/lab-wg.conf

  - id: mav_primary
    type: mavlink.router
    enabled: true
    config:
      tcp_server_port: 5760
      dedup_period_sec: 5
      report_stats: true
      endpoints:
        - type: uart
          name: flight_controller
          device: /dev/ttyACM0
          baud: [115200, 1500000, 57600]
        - type: udp
          name: gcs
          address: 0.0.0.0
          port: 14550
          mode: server

  - id: mav_ext_lab
    type: mavlink.extender
    enabled: true
    config:
      udp_port: 14550
      auto: true

links:
  - id: lab_mavlink
    from:
      component: vpn_lab
      port: tunnel
    to:
      component: mav_ext_lab
      port: transport
    bind:
      fields: [connection_id, interface_name, target_ip]

  - id: router_to_ext_lab
    from:
      component: mav_primary
      port: router
    to:
      component: mav_ext_lab
      port: upstream
    bind:
      fields: [router_ref]

triggers:
  - id: lab_mav_on_connect
    on: vpn.connected
    source: vpn_lab
    activate: [lab_mavlink, router_to_ext_lab]

  - id: lab_mav_on_disconnect
    on: vpn.disconnected
    source: vpn_lab
    deactivate: [lab_mavlink, router_to_ext_lab]
