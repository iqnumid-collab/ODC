  <line x1="77.7265" y1="250" x2="755.8824999999999" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="416.80449999999996" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">connect DUT:5760 or :14550</text>
</g>
<g class="message" data-from="Gcs" data-to="Drv" data-label="messages received" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="755.8824999999999" y1="290" x2="77.7265" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="416.80449999999996" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">messages received</text>
</g>
<g class="message" data-from="Drv" data-to="Rtr" data-label="stop start + daemon restart cases" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="77.7265" y1="345" x2="580.045" y2="345" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="328.88575" y="335" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">stop start + daemon restart cases</text>
</g>
<g class="note" data-position="over" data-actors="Dut">
  <polygon points="106.85799999999996,298 329.062,298 335.062,304 335.062,321 106.85799999999996,321" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="329.062,298 335.062,304 329.062,304" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="220.95999999999998" y="309.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Phases A/B: no vpn / rtsp / cellular required</text>
</g>
