</g>
<g class="actor" data-id="FC" data-label="Flight controller UART" data-type="participant">
  <rect x="316.467" y="30" width="164.36599999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="398.65" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Flight controller UART</text>
</g>
<g class="actor" data-id="Rtr" data-label="mavlink.router" data-type="participant">
  <rect x="520.833" y="30" width="118.424" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="580.045" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">mavlink.router</text>
</g>
<g class="actor" data-id="Gcs" data-label="GCS client TCP/UDP" data-type="participant">
  <rect x="679.257" y="30" width="153.25099999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="755.8824999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">GCS client TCP/UDP</text>
