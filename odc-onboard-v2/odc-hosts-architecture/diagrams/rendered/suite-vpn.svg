<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 839.537 455" width="839.537" height="455" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#3d59a1;--accent:#7aa2f7;--muted:#565f89;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Drv" x1="77.7265" y1="70" x2="77.7265" y2="425" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Dut" x1="220.95999999999998" y1="70" x2="220.95999999999998" y2="425" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Wan" x1="389.017" y1="70" x2="389.017" y2="425" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Vpn" x1="591.5305" y1="70" x2="591.5305" y2="425" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Srv" x1="765.5155" y1="70" x2="765.5155" y2="425" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Drv" data-to="Dut" data-label="apply VPN-only fixture" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="77.7265" y1="90" x2="220.95999999999998" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="149.34324999999998" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">apply VPN-only fixture</text>
</g>
<g class="message" data-from="Dut" data-to="Wan" data-label="ensure upstream ready" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="220.95999999999998" y1="130" x2="389.017" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="304.9885" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">ensure upstream ready</text>
</g>
<g class="message" data-from="Drv" data-to="Vpn" data-label="graph.components.start vpn_lab" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="77.7265" y1="170" x2="591.5305" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="334.6285" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">graph.components.start vpn_lab</text>
</g>
<g class="message" data-from="Vpn" data-to="Srv" data-label="handshake peer" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="591.5305" y1="210" x2="765.5155" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="678.5229999999999" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">handshake peer</text>
</g>
<g class="message" data-from="Srv" data-to="Vpn" data-label="tunnel up" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="765.5155" y1="250" x2="591.5305" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="678.5229999999999" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">tunnel up</text>
</g>
<g class="message" data-from="Vpn" data-to="Drv" data-label="TransportBinding ip_ready" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="591.5305" y1="290" x2="77.7265" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="334.6285" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">TransportBinding ip_ready</text>
</g>
<g class="message" data-from="Drv" data-to="Srv" data-label="peer list shows DUT" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="77.7265" y1="330" x2="765.5155" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="421.621" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">peer list shows DUT</text>
</g>
<g class="message" data-from="Drv" data-to="Vpn" data-label="disconnect then reconnect" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="77.7265" y1="385" x2="591.5305" y2="385" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="334.6285" y="375" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">disconnect then reconnect</text>
</g>
<g class="note" data-position="over" data-actors="Dut">
  <polygon points="121.11399999999995,338 314.80600000000004,338 320.80600000000004,344 320.80600000000004,361 121.11399999999995,361" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="314.80600000000004,338 320.80600000000004,344 314.80600000000004,344" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="220.95999999999998" y="349.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">assert no mav extender / rtsp running</text>
</g>
<g class="actor" data-id="Drv" data-label="molt driver" data-type="participant">
  <rect x="30" y="30" width="95.453" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="77.7265" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">molt driver</text>
</g>
<g class="actor" data-id="Dut" data-label="odc-device-*" data-type="participant">
  <rect x="165.45299999999997" y="30" width="111.01400000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="220.95999999999998" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">odc-device-*</text>
</g>
<g class="actor" data-id="Wan" data-label="cellular or eth WAN" data-type="participant">
  <rect x="316.467" y="30" width="145.1" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="389.017" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">cellular or eth WAN</text>
</g>
<g class="actor" data-id="Vpn" data-label="vpn.wireguard / openvpn" data-type="participant">
  <rect x="501.56699999999995" y="30" width="179.927" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="591.5305" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">vpn.wireguard / openvpn</text>
</g>
<g class="actor" data-id="Srv" data-label="hexa-five" data-type="participant">
  <rect x="721.4939999999999" y="30" width="88.043" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="765.5155" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">hexa-five</text>
</g>
</svg>