<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 678.149 415" width="678.149" height="415" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#3d59a1;--accent:#7aa2f7;--muted:#565f89;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Drv" x1="77.7265" y1="70" x2="77.7265" y2="385" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Src" x1="235.039" y1="70" x2="235.039" y2="385" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Cmp" x1="411.247" y1="70" x2="411.247" y2="385" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Mon" x1="583.009" y1="70" x2="583.009" y2="385" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Drv" data-to="Cmp" data-label="apply video-only fixture + local binding" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="77.7265" y1="90" x2="411.247" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="244.48675" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">apply video-only fixture + local binding</text>
</g>
<g class="message" data-from="Drv" data-to="Src" data-label="publish rtsp://127.0.0.1:8554/stream" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="77.7265" y1="130" x2="235.039" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="156.38275" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">publish rtsp://127.0.0.1:8554/stream</text>
</g>
<g class="message" data-from="Drv" data-to="Cmp" data-label="start rtsp_lab" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="77.7265" y1="170" x2="411.247" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="244.48675" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">start rtsp_lab</text>
</g>
<g class="message" data-from="Src" data-to="Cmp" data-label="ingest H264/H265 source" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="235.039" y1="210" x2="411.247" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="323.14300000000003" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">ingest H264/H265 source</text>
</g>
<g class="message" data-from="Cmp" data-to="Mon" data-label="republish :8555/stream" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="411.247" y1="250" x2="583.009" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="497.12800000000004" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">republish :8555/stream</text>
</g>
<g class="message" data-from="Mon" data-to="Drv" data-label="bandwidth greater than 0" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="583.009" y1="290" x2="77.7265" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="330.36775" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">bandwidth greater than 0</text>
</g>
<g class="message" data-from="Drv" data-to="Cmp" data-label="stop restart + port conflict cases" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="77.7265" y1="345" x2="411.247" y2="345" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="244.48675" y="335" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">stop restart + port conflict cases</text>
</g>
<g class="note" data-position="over" data-actors="Cmp">
  <polygon points="333.676,298 482.818,298 488.818,304 488.818,321 333.676,321" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="482.818,298 488.818,304 482.818,304" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="411.247" y="309.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">no vpn tunnel / mav / cellular</text>
</g>
<g class="actor" data-id="Drv" data-label="molt driver" data-type="participant">
