</g>
<g class="actor" data-id="Cmp" data-label="rtsp.compressor" data-type="participant">
  <rect x="344.625" y="30" width="133.244" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="411.247" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">rtsp.compressor</text>
</g>
<g class="actor" data-id="Mon" data-label="odc-rtsp-monitor" data-type="participant">
  <rect x="517.869" y="30" width="130.28000000000003" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="583.009" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">odc-rtsp-monitor</text>
</g>
</svg>