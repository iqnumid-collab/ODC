</g>
<g class="actor" data-id="Src" data-label="odc-video-source" data-type="participant">
  <rect x="165.45299999999997" y="30" width="139.17200000000003" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
