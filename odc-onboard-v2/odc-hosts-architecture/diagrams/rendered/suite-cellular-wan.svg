  <text x="149.34324999999998" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">disconnect / reconnect cases</text>
</g>
<g class="message" data-from="Dut" data-to="Mod" data-label="session teardown + reattach" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="220.95999999999998" y1="370" x2="366.046" y2="370" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
