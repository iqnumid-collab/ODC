<g class="actor" data-id="Gr" data-label="graph CLI" data-type="participant">
  <rect x="459.8015" y="30" width="92.489" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="506.046" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">graph CLI</text>
